name: Publish release

on:
  push:
    branches:
      - 'release/v[0-9]*'
    tags:
      - 'v[0-9]*'
  create:

permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && (github.ref_type == 'tag' || github.event.created == false)) ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve and validate release target
        id: version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            push:tag:v*) tag="$GITHUB_REF_NAME" ;;
            create:branch:release/v*|push:branch:release/v*) tag="${GITHUB_REF_NAME#release/}" ;;
            *) echo "::error::Not an explicit release request"; exit 1 ;;
          esac
          python -c 'import sys; from scripts.check_content import version_from_tag; version_from_tag(sys.argv[1])' "$tag"
          git merge-base --is-ancestor HEAD origin/main
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            test "$existing" = "$(git rev-parse HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Run release tooling tests
        run: python -m unittest discover -s tests -v
      - name: Validate and generate release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/check_content.py --release-tag "$RELEASE_TAG" --export-dir "$RUNNER_TEMP/release"
      - name: Include the version changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## {re.escape(tag)}(?: - [^\n]+)?\n(.*?)(?=^## |\Z)"
          entry = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)
          if entry is None or not entry.group(1).strip():
              raise SystemExit(f"Missing changelog entry for {tag}")
          notes = Path(os.environ["RUNNER_TEMP"]) / "release" / "release-notes.md"
          notes.write_text(notes.read_text(encoding="utf-8") + "\n## Changes\n\n" + entry.group(1).strip() + "\n", encoding="utf-8")
      - name: Publish verified release attachments
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: bash scripts/publish_release.sh
      - name: Remove completed release request branch
        if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/v')
        continue-on-error: true
        run: git push origin --delete "$GITHUB_REF_NAME"
