name: Content checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test content tooling
        run: python -m unittest discover -s tests -v
      - name: Validate prompts, counts, and links
        run: python scripts/check_content.py
      - name: Smoke-test generated release assets
        run: |
          python scripts/check_content.py --export-dir "${RUNNER_TEMP}/release-smoke"
          test -s "${RUNNER_TEMP}/release-smoke/custom-instructions-compact.txt"
          test -s "${RUNNER_TEMP}/release-smoke/custom-instructions-extended.txt"
          test -s "${RUNNER_TEMP}/release-smoke/release-notes.md"
